[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[dev]
  targetPort = 8080
  port = 8888
  publish = "dist/spa"
  functions = "netlify/functions"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/members"
  status = 200
  to = "/.netlify/functions/members"

[[redirects]]
  force = true
  from = "/api/auth/*"
  status = 200
  to = "/.netlify/functions/auth"

[[redirects]]
  force = true
  from = "/api/feedback"
  status = 200
  to = "/.netlify/functions/feedback"

[[redirects]]
  force = true
  from = "/api/stats"
  status = 200
  to = "/.netlify/functions/stats"

[[redirects]]
  force = true
  from = "/api/test"
  status = 200
  to = "/.netlify/functions/test"

[[redirects]]
  force = true
  from = "/api/debug"
  status = 200
  to = "/.netlify/functions/debug"

[[redirects]]
  force = true
  from = "/api/simple-test"
  status = 200
  to = "/.netlify/functions/simple-test"
